# N64Recomp config for WWF WrestleMania 2000 (USA, V1.2). Adapted from Revenge's
# revenge.toml (which came from World Tour's wcw.toml). Same entrypoint 0x80000400.
# FOUR overlays across two swap slots (see disasm/wm2k.yaml). Symbol-TOML mode.

[input]
entrypoint = 0x80000400
rom_file_path = "wm2k.z64"
bss_section_suffix = "_bss"
symbols_file_path = "syms/dump.toml"
output_func_path = "RecompiledFuncs"
trace_mode = false

[patches]
# First-recompile bootstrap, mirroring Revenge/WT: functions containing cop0/cache/
# eret/tlb opcodes are stubbed (syms/stub_candidates.txt, regenerated by
# tools/gen_stubs.py which rewrites this block). As identification proceeds these
# move to RENAMEs in tools/gen_symbols.py so the runtime provides them.
stubs = [
    "func_8002F480",
    "func_8002F530",
    "func_8002F5B0",
    "func_8002F630",
    "func_80032A50",
    "func_80036780",
    "func_80036CC4",
    "func_80036DFC",
    "func_80036F64",
    "func_80037680",
    "func_800376A0",
    "func_800376B0",
    "func_800376D0",
    "func_800376E0",
    "func_80037970",
    "func_800379D0",
    "func_800395D8",
    "func_8003B83C",
    "func_8003B86C",
]

ignored = [
]
