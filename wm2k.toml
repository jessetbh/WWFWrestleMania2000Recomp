# N64Recomp config for WWF WrestleMania 2000 (USA, V1.2). Adapted from Revenge's
# revenge.toml (which came from World Tour's wcw.toml). Same entrypoint 0x80000400.
# FOUR overlays across two swap slots (see disasm/wm2k.yaml). Symbol-TOML mode.

[input]
entrypoint = 0x80000400
rom_file_path = "wm2k.z64"
bss_section_suffix = "_bss"
symbols_file_path = "syms/dump.toml"
output_func_path = "RecompiledFuncs"
trace_mode = false

[patches]
# First-recompile bootstrap, mirroring Revenge/WT: functions containing cop0/cache/
# eret/tlb opcodes are stubbed (syms/stub_candidates.txt, regenerated by
# tools/gen_stubs.py which rewrites this block). As identification proceeds these
# move to RENAMEs in tools/gen_symbols.py so the runtime provides them.
stubs = [
    "func_8002F480",
    "func_8002F530",
    "func_8002F5B0",
    "func_8002F630",
    "func_80032A50",
    "func_80036780",
    "func_80036CC4",
    "func_80036DFC",
    "func_80036F64",
    "func_80037680",
    "func_800376A0",
    "func_800376B0",
    "func_800376D0",
    "func_800376E0",
    "func_80037970",
    "func_800379D0",
    "func_800395D8",
    "func_8003B83C",
    "func_8003B86C",
]

ignored = [
    # not in N64Recomp's built-in auto-ignore set (unlike osCartRomInit), but
    # librecomp exports osDriveRomInit_recomp — route calls to the shim.
    "osDriveRomInit",
]

# Idle-thread cooperative-yield fix, mirroring wcw.toml/revenge.toml's documented
# patch: after launching all threads and dropping its own priority to 0, the main
# thread (func_800004D0) parks in `jal func_80031280; j 0x800005A4` — a busy spin
# that never yields under ultramodern's cooperative scheduler, starving message
# delivery (boot9: ext backlog +60/s, del/s=0, vis/s=0). Rewriting the backward j
# at 0x800005AC into a self-branch (`b .` = 0x1000FFFF) makes N64Recomp emit
# pause_self(), which drains external messages and yields.
[[patches.instruction]]
func = "func_800004D0"
vram = 0x800005AC
value = 0x1000FFFF

# Music invalid-id assert defused (bringup-plan session 5). func_80003DD4(out, id)
# resolves a song id (valid 1..0x2847) to its ROM location; its invalid-id branch is
# `j .` — an assert-hang that recompiles to pause_self and parks the calling thread
# FOREVER (observed boot36/38: gfx frozen, audio alive). The corrupt ids came from a
# music-slot init/use race that only opened under the (since-fixed) scheduler
# starvation, but a silent permanent park is the worst possible failure mode, so:
# rewrite the j-self at 0x80003DF0 to `addiu $a1, $zero, 1` (0x24050001) — an invalid
# id falls through and resolves as song 1: deterministic, in-range, no hang.
[[patches.instruction]]
func = "func_80003DD4"
vram = 0x80003DF0
value = 0x24050001
